# Tests UI des deux plateformes (Android instrumentés, Swift des packages SPM).
# Workflow séparé de ci.yml : ci.yml reste commun aux trois POC pour garder la métrique « durée pipeline PR »
# comparable. Ces jobs sont plus lents (émulateur, simulateur) et mesurés à part.
# Build par impact (semaine 2) : le job `impact` calcule les modules touchés (scripts/affected-modules.sh) ;
# les jobs lents ne tournent que si leur plateforme est impactée, et seulement sur les modules impactés.
name: tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      android: ${{ steps.affected.outputs.android }}
      android_test_tasks: ${{ steps.affected.outputs.android_test_tasks }}
      ios: ${{ steps.affected.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x scripts/*.sh
      - name: Modules impactés
        id: affected
        env:
          # PR : base de la PR ; push : commit précédent (vide ou 000… au premier push → tout est impacté).
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./scripts/affected-modules.sh --base "$BASE" --format github > "$RUNNER_TEMP/affected.txt"
          cat "$RUNNER_TEMP/affected.txt" | tee -a "$GITHUB_OUTPUT"
          { echo '### Build par impact'; echo '```'; cat "$RUNNER_TEMP/affected.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Tests unitaires ciblés
        if: steps.affected.outputs.tasks != ''
        run: ./gradlew ${{ steps.affected.outputs.tasks }} --console=plain
  android-instrumented:
    needs: impact
    if: needs.impact.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x scripts/*.sh
      # Compilation des APK de test hors émulateur : l'émulateur ne démarre que pour l'exécution.
      - name: Compiler les APK de test
        run: ./gradlew assembleDebugAndroidTest --console=plain
      - name: Tests instrumentés (émulateur API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/test-android-instrumented.sh ${{ needs.impact.outputs.android_test_tasks }}
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: android/**/build/reports/androidTests/
  ios-tests:
    needs: impact
    if: needs.impact.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x scripts/*.sh
      - name: Version de Xcode (clé de cache)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      # Toolchain et caches Kotlin/Native (~/.konan) : non couverts par setup-gradle, retéléchargés sinon.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # DerivedData des packages SPM (semaine 2) : clé exacte sur les sources Swift, sinon le plus récent
      # de la même version de Xcode (restore-keys) pour un build incrémental.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: dd-tests-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/**/*.swift', 'ios/**/Package.resolved', 'shared/**/*.kt') }}
          restore-keys: dd-tests-${{ steps.xcode.outputs.version }}-
      - name: Tests Swift (packages SPM, simulateur)
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
        run: ./scripts/test-ios.sh
