# Spécification XcodeGen de l'app iOS. Le .xcodeproj est généré par scripts/build-ios.sh et n'est pas versionné.
name: App
options:
  bundleIdPrefix: com.poc
  deploymentTarget:
    iOS: "17.0"
packages:
  Core:
    path: ../Core
  AuthUI:
    path: ../Features/Auth
  CatalogUI:
    path: ../Features/Catalog
  CartUI:
    path: ../Features/Cart
targets:
  App:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Core
      - package: AuthUI
      - package: CatalogUI
      - package: CartUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poc.mobile
        PRODUCT_NAME: App
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
