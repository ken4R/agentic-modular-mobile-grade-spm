# Source de vérité du projet Xcode. Régénérer : (cd ios && xcodegen generate). App.xcodeproj est commité
# car la CI (ci.yml commun, non modifiable) n'installe pas XcodeGen.
name: App
options:
  bundleIdPrefix: poc.mobile
  deploymentTarget:
    iOS: "17.0"
packages:
  Core:
    path: Core
  Auth:
    path: Features/Auth
  Catalog:
    path: Features/Catalog
  Cart:
    path: Features/Cart
targets:
  App:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: Core
      - package: Auth
        product: AuthUI
      - package: Catalog
        product: CatalogUI
      - package: Cart
        product: CartUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: poc.mobile.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
    scheme: {}
